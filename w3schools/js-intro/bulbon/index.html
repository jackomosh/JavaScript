<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulb On / Off</title>
</head>
<body>
    <p>Switching Bulb</p>
    <button onclick='document.getElementById("myImage").src="pic_bulbon.gif"'>Turn bulb on</button>
    <img id="myImage" src="pic_bulboff.gif" alt="bulb">
    <button onclick='document.getElementById("myImage").src="pic_bulboff.gif"'>Turn bulb off</button>
</body>
</html>
